name = "boss-vao-lenh"
main = "src/index.js"
compatibility_date = "2026-09-25"
# Production build: Binance hedge v1 with hardened TP/SL cleanup
# Strategy: BTCUSDT USD-M Futures hedge LONG+SHORT every 15m

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "BOSS_KV"
id = "843ba5a3a1cf434da559ea21e59d87c7"

# Required Cloudflare Secrets for live trading:
# BINANCE_API_KEY
# BINANCE_API_SECRET
#
# Optional Telegram Secrets:
# CLOUD_TELEGRAM_BOT_TOKEN
# CLOUD_TELEGRAM_CHAT_ID
#
# Runtime variables:
# BINANCE_LIVE_TRADING = false
# HEDGE_NOTIONAL_USDT = 10
# HEDGE_LEVERAGE = 1
# HEDGE_KA = 1.5
# HEDGE_KB = 0.5
# HEDGE_BE = true
# HEDGE_FILTER = true
# HEDGE_FEE = 0.0005
# HEDGE_SLIP = 0.0001
